<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file:;">
    <title>Satori</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Songti SC', 'Georgia', serif;
            /* 深空底色（Satori 品牌色，aurora 主题同源）；splash 显示时主题样式表尚未就绪，用固定品牌色 */
            background: #0D1220;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -webkit-app-region: drag;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
        }
        .splash-avatar {
            width: 76px; height: 76px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(143, 184, 255, 0.22);
            padding: 10px;
            pointer-events: none;
            user-select: none;
            animation: avatarIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes avatarIn {
            from { opacity: 0; transform: translateY(10px) scale(0.92); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .splash-text-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            justify-content: center;
        }
        .splash-text {
            font-size: 0.82rem;
            color: #B8C4DA;
            letter-spacing: 0.02em;
            line-height: 1.5;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }
        .splash-text.switching { opacity: 0; }
        .splash-sakura {
            display: inline-flex;
            align-items: center;
            font-size: 1.05rem;
            color: var(--splash-accent, #5B8DEF);
            flex-shrink: 0;
            line-height: 1;
            animation: spin 4s linear infinite;
        }
        /* 底部进度光条：accent 流光扫过 */
        .splash-progress {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 2px;
            background: rgba(143, 184, 255, 0.08);
            overflow: hidden;
        }
        .splash-progress::after {
            content: "";
            position: absolute;
            top: 0; left: -40%;
            width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, #5B8DEF, #8F7BF2, transparent);
            animation: sweep 1.6s ease-in-out infinite;
        }
        @keyframes sweep { to { left: 100%; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="react-root"></div>
    <div class="splash-progress"></div>
    <script src="modules/platform.js"></script>
    <script type="module" src="./splash-main.tsx"></script>
</body>
</html>
